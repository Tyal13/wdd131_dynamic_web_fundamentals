<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Pics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="coolpics.css">
    <script defer src="coolpics.js"></script>
</head>
<body>

    <header>
        <h1>Cool Pics 📷</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Ponder</a>
            <a href="#">Prove</a>
            <a href="#">Contact</a>
        </nav>
        <button class="menu-btn">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </button>
    </header>

    <div class="section-title">
        <h2>Current Work</h2>
    </div>

    <main class="gallery">
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 1">
        </section>
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 2">
        </section>
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 3">
        </section>
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 4">
        </section>
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 5">
        </section>
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 6">
        </section>
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 7">
        </section>
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 8">
        </section>
        <section class="image-card">
            <img src="img/image.png" alt="Cool picture 9">
        </section>
    </main>

    <dialog>
        <img>
        <button class="close-viewer">X</button>
    </dialog>

    <footer>Adam Herrmann</footer>

</body>
</html>
